name: Vimeo Telegram Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install requests feedparser

      - run: python vimeo_telegram.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
